[theme]
# Tema base alineado con el diseño de expediente clínico (app/theme.py).
# Si este bloque queda en oscuro, el chrome nativo de Streamlit asoma oscuro
# alrededor del CSS propio y el conjunto se ve parcheado.
base = "light"
primaryColor = "#22485E"
backgroundColor = "#E9EAE6"
secondaryBackgroundColor = "#FBFBF9"
textColor = "#1C1F1D"
font = "sans serif"

[server]
runOnSave = false
# El watcher de archivos de Streamlit recorre TODOS los módulos instalados al
# arrancar y escupe cientos de errores falsos de `transformers` (módulos
# opcionales que requieren `torchvision`, que no usa este proyecto).
# Desactivarlo deja el log limpio para la grabación de la sustentación.
# Consecuencia: tras editar app/app_sustentacion.py hay que reiniciar la app
# (Ctrl+C y volver a ejecutar `uv run streamlit run app/app_sustentacion.py`).
fileWatcherType = "none"

[browser]
gatherUsageStats = false
