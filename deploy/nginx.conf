# ---------------------------------------------------------------------------
# Reverse proxy nginx + TLS para la app Streamlit
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/computacion-nube
#   sudo ln -s /etc/nginx/sites-available/computacion-nube /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d rag.tudominio.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# Streamlit usa WebSockets: sin las cabeceras Upgrade/Connection la app
# "carga" pero nunca muestra resultados (la sesión se queda colgada).
# ---------------------------------------------------------------------------
upstream streamlit_app {
    server 127.0.0.1:8501;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name rag.tudominio.com;

    # Certbot reescribe este bloque para redirigir a https.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rag.tudominio.com;

    # Certbot gestiona estos archivos:
    ssl_certificate     /etc/letsencrypt/live/rag.tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rag.tudominio.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # --- Cabeceras de seguridad -------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # --- Payload de Streamlit ---------------------------------------------
    client_max_body_size 20M;

    location / {
        proxy_pass         http://streamlit_app;
        proxy_http_version 1.1;

        # WebSocket de Streamlit
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El benchmark consulta Qdrant Cloud: no corte la conexión por inactividad
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_buffering     off;
    }
}
