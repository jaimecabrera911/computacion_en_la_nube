[project]
name = "computacion-en-la-nube"
version = "1.0.0"
description = "ACA N° 1 — Sistema RAG cloud serverless en salud sobre Qdrant Cloud con embeddings abiertos (CUN, Especialización en Inteligencia Artificial)."
readme = "README.md"
authors = [
    { name = "Jaime A Cabrera A", email = "cabrerajaimeandres@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.4.0",
    "langchain-text-splitters>=1.1.3",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pypdf>=6.21.0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.19.1",
    "reportlab>=5.0.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.66.1",
    "tabulate>=0.10.0",
    "ucimlrepo>=0.0.7",
]

[project.scripts]
rag = "rag.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rag"
module-root = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
