# ---------------------------------------------------------------------------
# Orquestación local / servidor único — Streamlit + Qdrant Cloud
#
#   docker compose up -d --build     → http://localhost:8501
#   docker compose logs -f app
#   docker compose down
# ---------------------------------------------------------------------------
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: computacion-nube:1.0.0
    container_name: computacion-nube
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      # Sobrescribe el .env local si el servidor usa otro nombre de colección
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-clinical_heart_disease_rag}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
    volumes:
      # Caché de HuggingFace persistente: si no, el modelo se baja en cada arranque
      - hf-cache:/opt/hf-cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  hf-cache:
